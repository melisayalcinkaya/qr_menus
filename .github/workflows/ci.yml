name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Eksik migration var mı?
        run: python manage.py makemigrations --check --dry-run
      - name: Testler ve kapsam
        run: |
          coverage run manage.py test api
          coverage report --fail-under=90
      - name: Demo verisi yüklenebiliyor mu?
        run: python manage.py migrate --noinput && python manage.py seed_demo

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker imajı + duman testi
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qr-menu .
      - name: Konteyneri production ayarlarıyla başlat
        run: |
          docker run -d --name app -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-smoke-test \
            -e DJANGO_ALLOWED_HOSTS=localhost \
            -e SECURE_SSL_REDIRECT=false \
            qr-menu
          for i in $(seq 1 30); do curl -fs http://localhost:8000/api/meta/ >/dev/null && break; sleep 1; done
      - name: Uç noktaları kontrol et
        run: |
          set -e
          curl -fs http://localhost:8000/ | grep -q 'id="root"'
          curl -fs http://localhost:8000/m/liman-bistro | grep -q 'id="root"'
          curl -fs http://localhost:8000/api/public/liman-bistro/ | grep -q 'Liman Bistro'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/waiter-calls/)" = 401
          curl -fsI http://localhost:8000/ | grep -qi 'content-security-policy'
          curl -fsI -H 'X-Forwarded-Proto: https' http://localhost:8000/ | grep -qi 'strict-transport-security'
      - if: failure()
        run: docker logs app
